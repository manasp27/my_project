<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreeLancr — Find Work. Hire Talent.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="logo" data-link>
        <span class="logo-icon">⚡</span>FreeLancr
      </a>
      <div class="nav-links" id="navLinks">
        <a href="/projects" data-link class="nav-link">Browse Projects</a>
        <a href="/freelancers" data-link class="nav-link">Find Talent</a>
        <a href="/how-it-works" data-link class="nav-link">How It Works</a>
      </div>
      <div class="nav-actions" id="navActions">
        <a href="/login" data-link class="btn btn-ghost">Login</a>
        <a href="/register" data-link class="btn btn-primary">Get Started</a>
      </div>
      <!-- Logged-in actions (hidden by default) -->
      <div class="nav-user hidden" id="navUser">
        <a href="/dashboard" data-link class="btn btn-ghost">Dashboard</a>
        <div class="notif-bell" id="notifBell">
          <span class="bell-icon">🔔</span>
          <span class="notif-badge hidden" id="notifBadge">0</span>
          <div class="notif-dropdown hidden" id="notifDropdown"></div>
        </div>
        <div class="user-avatar-wrap" id="userAvatarWrap">
          <img src="" alt="" class="user-avatar-sm" id="navAvatar" />
          <div class="avatar-menu hidden" id="avatarMenu">
            <a href="/profile" data-link>My Profile</a>
            <a href="/dashboard" data-link>Dashboard</a>
            <a href="/messages" data-link>Messages</a>
            <a href="/payments" data-link>Wallet</a>
            <hr/>
            <a href="#" id="logoutBtn">Sign Out</a>
          </div>
        </div>
      </div>
      <button class="hamburger" id="hamburger">☰</button>
    </div>
  </nav>

  <!-- Main app container -->
  <main id="app"></main>

  <!-- Toast notifications -->
  <div id="toastContainer"></div>

  <!-- Modal overlay -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/pages/home.js"></script>
  <script src="/js/pages/auth.js"></script>
  <script src="/js/pages/projects.js"></script>
  <script src="/js/pages/freelancers.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/profile.js"></script>
  <script src="/js/pages/messages.js"></script>
  <script src="/js/pages/payments.js"></script>
  <script src="/js/pages/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
